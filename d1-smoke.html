<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D1 后端链路冒烟测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1f2329;padding:20px;line-height:1.6}
.wrap{max-width:840px;margin:0 auto}
h1{font-size:20px;font-weight:600;color:#003a8c;margin-bottom:6px}
.sub{font-size:13px;color:#595959;margin-bottom:16px}
.card{background:#fff;border:1px solid #d9d9d9;border-radius:10px;padding:18px;margin-bottom:14px}
.btn{background:#1677ff;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:16px;cursor:pointer;min-height:44px}
.btn:disabled{background:#91caff}
#sum{margin-top:14px;padding:12px 16px;border-radius:8px;background:#e6f4ff;color:#003a8c;font-weight:600;display:none}
#sum.bad{background:#fff1f0;color:#a8071a}
ul{list-style:none}
li{padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:14px;display:flex;gap:10px;align-items:flex-start}
li:last-child{border-bottom:0}
.tag{flex:0 0 auto;font-size:12px;padding:2px 9px;border-radius:4px;margin-top:2px}
.ok{background:#e6f4ff;color:#0958d9}.no{background:#fff1f0;color:#a8071a}.run{background:#f5f5f5;color:#8c8c8c}
.nm{flex:1}.dt{font-size:12px;color:#8c8c8c;display:block;margin-top:2px;word-break:break-all}
.note{font-size:12px;color:#8c8c8c;line-height:1.9}
@media(max-width:600px){body{padding:12px}.btn{width:100%}}
</style>
</head>
<body><div class="wrap">
<h1>D1 后端链路冒烟测试</h1>
<p class="sub">验证建表、数据隔离、防提权、COS 签名四条链路。只建测试数据，不碰业务数据。</p>
<div class="card"><button class="btn" id="go" onclick="run()">开始测试</button><div id="sum"></div></div>
<div class="card"><ul id="log"></ul></div>
<div class="card"><p class="note">
<b>说明</b><br>
· 每次跑会新建 2 个测试账号 + 2 家测试公司 + 1 个测试项目，随机邮箱不会撞车。<br>
· 第 9、10、11、12 项是<b>安全红线</b>，任一条不过就不能往下做。<br>
· 测试账号需到后台 users 表手动删，或用文末清理命令。
</p></div>
</div>
<script>
var S={tkA:'',tkB:'',orgA:'',projA:''};
var rnd=String(Date.now()).slice(-8)+Math.random().toString(36).slice(2,6);
var A='d1a'+rnd+'@t.local',B='d1b'+rnd+'@t.local',H='d1h'+rnd+'@t.local',P='Test@12345';
var logEl=document.getElementById('log'),pass=0,fail=0;
function api(p,o){return fetch(location.origin+p,o||{}).then(function(r){return r.text().then(function(t){var j=null;try{j=JSON.parse(t)}catch(e){}return{status:r.status,json:j,text:t}})});}
function post(p,b,tk){var h={'Content-Type':'application/json'};if(tk)h.Authorization=tk;return api(p,{method:'POST',headers:h,body:JSON.stringify(b||{})});}
function row(n){var li=document.createElement('li'),g=document.createElement('span'),m=document.createElement('span');g.className='tag run';g.textContent='运行中';m.className='nm';m.textContent=n;li.appendChild(g);li.appendChild(m);logEl.appendChild(li);return{g:g,m:m};}
function done(u,r){if(r&&r.ok){pass++;u.g.className='tag ok';u.g.textContent='通过'}else{fail++;u.g.className='tag no';u.g.textContent='失败'}if(r&&r.msg){var s=document.createElement('span');s.className='dt';s.textContent=r.msg;u.m.appendChild(s)}}
var tests=[
['1 服务探活 /api/ping',function(){return api('/api/ping').then(function(r){return{ok:r.status===200&&r.json&&r.json.ok,msg:'HTTP '+r.status}})}],
['2 注册用户 A',function(){return post('/api/collections/users/records',{email:A,password:P,passwordConfirm:P}).then(function(r){return{ok:r.status===200,msg:'HTTP '+r.status+' '+r.text.slice(0,90)}})}],
['3 用户 A 登录取 token',function(){return post('/api/collections/users/auth-with-password',{identity:A,password:P}).then(function(r){if(r.status===200&&r.json&&r.json.token)S.tkA=r.json.token;return{ok:!!S.tkA,msg:'HTTP '+r.status}})}],
['4 身份查询（应未加入公司）',function(){return api('/api/me',{headers:{Authorization:S.tkA}}).then(function(r){var j=r.json||{};return{ok:r.status===200&&j.signedIn===true&&!j.org_id,msg:'signedIn='+j.signedIn+' 公司='+(j.org_id||'空')}})}],
['5 创建公司（应 14 天试用 + admin）',function(){return post('/api/org/create',{name:'冒烟公司A-'+rnd},S.tkA).then(function(r){var j=r.json||{};if(j.orgId)S.orgA=j.orgId;return{ok:r.status===200&&!!j.orgId&&j.role==='admin'&&j.plan==='trial',msg:'HTTP '+r.status+' plan='+j.plan+' role='+j.role+' orgId='+(j.orgId||'无')}})}],
['6 创建项目',function(){return post('/api/collections/projects/records',{org_id:S.orgA,name:'冒烟项目A',proj_type:'旧房改造',biz_type:'个人',amount:88000,status:'进行中'},S.tkA).then(function(r){var j=r.json||{};if(j.id)S.projA=j.id;return{ok:r.status===200&&!!j.id,msg:'HTTP '+r.status+' id='+(j.id||'无')}})}],
['7 A 列出项目（应 1 条）',function(){return api('/api/collections/projects/records',{headers:{Authorization:S.tkA}}).then(function(r){var n=r.json&&r.json.items?r.json.items.length:-1;return{ok:n===1,msg:'共 '+n+' 条'}})}],
['8 注册用户 B 并开第二家公司',function(){return post('/api/collections/users/records',{email:B,password:P,passwordConfirm:P}).then(function(r1){if(r1.status!==200)return{ok:false,msg:'B 注册失败 HTTP '+r1.status};return post('/api/collections/users/auth-with-password',{identity:B,password:P}).then(function(r2){if(r2.status!==200||!r2.json||!r2.json.token)return{ok:false,msg:'B 登录失败 HTTP '+r2.status};S.tkB=r2.json.token;return post('/api/org/create',{name:'冒烟公司B-'+rnd},S.tkB).then(function(r3){return{ok:r3.status===200&&!!(r3.json&&r3.json.orgId),msg:'HTTP '+r3.status}})})})}],
['9 【红线】B 看不到 A 的项目（必须 0 条）',function(){return api('/api/collections/projects/records',{headers:{Authorization:S.tkB}}).then(function(r){var n=r.json&&r.json.items?r.json.items.length:-1;return{ok:n===0,msg:'共 '+n+' 条，必须为 0'}})}],
['10 【红线】B 按 id 直读 A 的项目（必须 404）',function(){return api('/api/collections/projects/records/'+S.projA,{headers:{Authorization:S.tkB}}).then(function(r){return{ok:r.status===404,msg:'实际 HTTP '+r.status+'，必须 404'}})}],
['11 【红线】B 篡改 A 的项目（必须 404）',function(){return api('/api/collections/projects/records/'+S.projA,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:S.tkB},body:JSON.stringify({name:'被篡改'})}).then(function(r){return{ok:r.status===404,msg:'实际 HTTP '+r.status+'，必须 404'}})}],
['12 【红线】注册时自我提权 role=admin（必须 400）',function(){return post('/api/collections/users/records',{email:H,password:P,passwordConfirm:P,role:'admin'}).then(function(r){return{ok:r.status===400,msg:'实际 HTTP '+r.status+'，必须 400'}})}],
['13 COS 上传签名（应拿到预签名 URL）',function(){return post('/cos/sign',{size:250000,photoType:'progress',contentType:'image/webp',filename:'a.webp'},S.tkA).then(function(r){var j=r.json||{},u=j.uploads&&j.uploads.compressed&&j.uploads.compressed.url;return{ok:r.status===200&&!!u&&u.indexOf('cos.')>-1,msg:'HTTP '+r.status+' mode='+j.mode+' '+(u?'URL 已签发':(j.error||'无 URL'))}})}],
['14 未登录列项目（必须 404）',function(){return api('/api/collections/projects/records').then(function(r){return{ok:r.status===404,msg:'实际 HTTP '+r.status+'，必须 404'}})}],
['15 清理测试项目',function(){return api('/api/collections/projects/records/'+S.projA,{method:'DELETE',headers:{Authorization:S.tkA}}).then(function(r){return{ok:r.status===204||r.status===200,msg:'HTTP '+r.status}})}]
];
function run(){
  document.getElementById('go').disabled=true;
  logEl.innerHTML='';pass=0;fail=0;
  var sum=document.getElementById('sum');sum.style.display='none';
  var i=0;
  (function next(){
    if(i>=tests.length){sum.style.display='block';sum.className=fail?'bad':'';
      sum.textContent=fail?('通过 '+pass+' 项，失败 '+fail+' 项 —— 有红线未过，先别往下做'):('全部 '+pass+' 项通过 —— 后端链路已打通，可以开始前端改造');
      document.getElementById('go').disabled=false;return;}
    var t=tests[i++],u=row(t[0]);
    Promise.resolve().then(t[1]).then(function(r){done(u,r)}).catch(function(e){done(u,{ok:false,msg:String(e&&e.message||e)})}).then(next);
  })();
}
</script>
</body></html>
